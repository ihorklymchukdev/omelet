server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # An add_header inside a location drops every one inherited from the
    # server block, so each location includes the security headers itself.
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # No SPA fallback: a missing agent file must be a 404, not index.html.
    location /agent-guides/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
